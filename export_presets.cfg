<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-title\" content=\"Magic War\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<script>
// Magic War: track the game's audio so it stops when the page is hidden
// (another tab, app switch, locked phone) and comes back when it returns,
// and so the very first touch anywhere (even the loading screen) starts it.
(function () {
  var Real = window.AudioContext || window.webkitAudioContext;
  if (!Real) return;
  var made = [];
  function Tracked(options) { var c = new Real(options); made.push(c); return c; }
  Tracked.prototype = Real.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  function hidden() { return document.visibilityState === 'hidden'; }
  function quiet() { made.forEach(function (c) { if (c.state === 'running') c.suspend().catch(function () {}); }); }
  function wake() { if (!hidden()) made.forEach(function (c) { if (c.state === 'suspended') c.resume().catch(function () {}); }); }
  document.addEventListener('visibilitychange', function () { if (hidden()) quiet(); else wake(); });
  window.addEventListener('pagehide', quiet);
  window.addEventListener('blur', function () { if (hidden()) quiet(); });
  window.addEventListener('pageshow', wake);
  ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown', 'click'].forEach(function (t) {
    window.addEventListener(t, wake, { capture: true, passive: true });
  });
})();
</script>"
